name: Apply Part 3 Birth Number consolidation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: github.head_ref == 'cleanup/part3-birth-number-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Part 3 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply consolidation when migration is present
        shell: bash
        run: |
          if [[ -f scripts/apply-part3-consolidation.mjs ]]; then
            node scripts/apply-part3-consolidation.mjs
          else
            echo "Part 3 migration already applied."
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit validated consolidation when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Consolidate Birth Number refinements"
          git push origin HEAD:${{ github.head_ref }}
