name: Apply Name Energy pronology wording

on:
  push:
    branches:
      - content/name-energy-chaldean

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v7
        with:
          ref: content/name-energy-chaldean
          fetch-depth: 0

      - name: Update tile, details and cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_tile = 'Name alignment rooted in Chaldean numerology, using your date of birth, layered calculations and sound-vibration analysis, including personalised naming guidance for newborns.'
          new_tile = 'Name alignment rooted in Chaldean numerology and pronology, using your date of birth, layered numerical calculations and sound-vibration analysis, including personalised naming guidance for newborns.'
          if html.count(old_tile) != 1:
              raise SystemExit(f'Expected exactly one old tile summary, found {html.count(old_tile)}')
          html = html.replace(old_tile, new_tile)
          old_ref = 'service-details.js?v=4'
          new_ref = 'service-details.js?v=5'
          if html.count(old_ref) != 1:
              raise SystemExit(f'Expected exactly one old service-details reference, found {html.count(old_ref)}')
          html = html.replace(old_ref, new_ref)
          index.write_text(html, encoding='utf-8')

          details = Path('service-details.js')
          text = details.read_text(encoding='utf-8')
          old_para2 = 'Name Energy Alignment is rooted in Chaldean numerology and combines multiple layers of numerological calculations with the sound vibrations associated with individual alphabets to assess and create balanced name combinations.'
          new_para2 = 'Name Energy Alignment brings together Chaldean numerology and pronology, combining layered numerical calculations with the sound, pronunciation and vibrational qualities of individual alphabets to assess and create balanced name combinations.'
          old_para3 = 'The service also includes creating numerologically aligned names for newborn babies, taking the child’s date of birth into consideration.'
          new_para3 = 'The service also includes creating numerologically and phonetically aligned names for newborn babies, taking the child’s date of birth into consideration.'
          old_para4 = 'The objective is to identify a name considered more supportive and harmonious within the Rudrankaa numerological framework.'
          new_para4 = 'The objective is to identify a name considered more supportive, harmonious and well aligned within the Rudrankaa numerological framework.'
          for old, new, label in [
              (old_para2, new_para2, 'method paragraph'),
              (old_para3, new_para3, 'newborn paragraph'),
              (old_para4, new_para4, 'objective paragraph'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one old {label}, found {text.count(old)}')
              text = text.replace(old, new)
          details.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check service-details.js

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Check whitespace
        run: git diff --check

      - name: Commit content update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-details.js
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "Add pronology to Name Energy Alignment"
          git push origin HEAD:content/name-energy-chaldean
