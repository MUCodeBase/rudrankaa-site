name: Apply Name Energy popup Chaldean wording

on:
  push:
    branches:
      - content/name-energy-chaldean

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@v7
        with:
          ref: content/name-energy-chaldean
          fetch-depth: 0

      - name: Update popup copy and cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          details = Path('service-details.js')
          text = details.read_text(encoding='utf-8')
          old = 'Name Energy Alignment combines multiple layers of numerological calculations with the sound vibrations associated with individual alphabets to assess and create balanced name combinations.'
          new = 'Name Energy Alignment is rooted in Chaldean numerology and combines multiple layers of numerological calculations with the sound vibrations associated with individual alphabets to assess and create balanced name combinations.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old popup paragraph, found {text.count(old)}')
          details.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_ref = 'service-details.js?v=3'
          new_ref = 'service-details.js?v=4'
          if html.count(old_ref) != 1:
              raise SystemExit(f'Expected exactly one old service-details reference, found {html.count(old_ref)}')
          index.write_text(html.replace(old_ref, new_ref), encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check service-details.js

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Commit content update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-details.js index.html
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "Clarify Chaldean basis in Name Energy details"
          git push origin HEAD:content/name-energy-chaldean
