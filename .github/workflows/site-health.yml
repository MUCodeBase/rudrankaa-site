name: Site health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        run: git diff --check
