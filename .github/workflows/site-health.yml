name: Site health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-part1-cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/part1-repo-health'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply controlled cleanup
        run: node scripts/apply-part1-cleanup.mjs

      - name: Restore permanent read-only Site health workflow
        shell: bash
        run: |
          cat > .github/workflows/site-health.yml <<'YAML'
          name: Site health

          on:
            pull_request:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24

                - name: Check JavaScript syntax
                  shell: bash
                  run: |
                    while IFS= read -r -d '' file; do
                      node --check "$file"
                    done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

                - name: Validate site structure and assets
                  run: node scripts/validate-site.mjs

                - name: Check whitespace errors
                  run: git diff --check
          YAML

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repository health debt"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    if: github.event_name != 'pull_request' || github.head_ref != 'cleanup/part1-repo-health'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        run: git diff --check
