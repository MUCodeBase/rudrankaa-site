name: Site health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-part2-service-grid:
    if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/part2-structural-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Part 2 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Repair service grid and validator
        run: node scripts/fix-part2-service-grid.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete service grid"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    if: github.event_name != 'pull_request' || github.head_ref != 'cleanup/part2-structural-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site structure and assets
        run: node scripts/validate-site.mjs

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format= HEAD
          fi
