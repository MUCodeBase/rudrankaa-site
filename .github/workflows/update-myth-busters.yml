name: Update Myth Busters gallery

on:
  push:
    paths:
      - "assets/myth-busters/**"
      - "!assets/myth-busters/manifest.json"
      - "!assets/myth-busters/thumbnails/**"
      - "scripts/build-myth-buster-thumbnails.mjs"
      - "scripts/build-myth-busters-manifest.mjs"
      - ".github/workflows/update-myth-busters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the updated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp

      - name: Generate lightweight card images
        run: node scripts/build-myth-buster-thumbnails.mjs

      - name: Generate the gallery manifest
        run: node scripts/build-myth-busters-manifest.mjs

      - name: Commit generated gallery assets when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/myth-busters/thumbnails assets/myth-busters/manifest.json)" ]]; then
            echo "The Myth Busters gallery assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/myth-busters/thumbnails assets/myth-busters/manifest.json
          git commit -m "Optimize Myth Busters gallery assets"
          git push
