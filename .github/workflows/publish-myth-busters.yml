name: Publish Myth Busters

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: publish-myth-busters
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create short-lived Rudrankaa Publisher token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RUDRANKAA_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.RUDRANKAA_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rudrankaa-site
            rudrankaa-myth-busters

      - name: Check out website repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Myth Busters upload repository
        uses: actions/checkout@v7
        with:
          repository: MUCodeBase/rudrankaa-myth-busters
          token: ${{ steps.app-token.outputs.token }}
          path: incoming-myth-busters
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp

      - name: Import new Myth Buster sources
        run: node scripts/import-myth-busters.mjs incoming-myth-busters/uploads

      - name: Stop when nothing is new
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/myth-busters)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new Myth Busters to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate thumbnails
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/build-myth-buster-thumbnails.mjs

      - name: Generate manifest
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/build-myth-busters-manifest.mjs

      - name: Run Site Health validation
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/validate-site.mjs

      - name: Create publishing branch and commit
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          branch="content/myth-busters-${stamp}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- assets/myth-busters
          git commit -m "Publish new Myth Busters"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"

      - name: Open protected publishing PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Publish new Myth Busters" \
            --body "Automated Myth Busters publishing batch from the dedicated upload repository. Source PNGs were validated and generated gallery assets were rebuilt before this PR was opened.")"
          echo "Created $pr_url"

          # This succeeds only when repository auto-merge is enabled. The main
          # ruleset and its required validate check remain authoritative.
          gh pr merge "$pr_url" --auto --squash
