name: Apply v1.5 Lighthouse fixes

on:
  push:
    branches:
      - cleanup/v1.5-closure

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/v1.5-closure
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp

      - name: Generate optimized display assets
        shell: bash
        run: |
          cwebp -quiet -q 94 -m 6 -sharp_yuv -resize 440 0 assets/rudrankaa-logo-600.png -o assets/rudrankaa-logo-440.webp

          dwebp assets/watermarks/ardhanarishwar-watermark.webp -o /tmp/ardhanarishwar.png
          cwebp -quiet -q 82 -m 6 -sharp_yuv -resize 520 520 /tmp/ardhanarishwar.png -o assets/watermarks/ardhanarishwar-watermark-520.webp

          dwebp assets/watermarks/om-watermark.webp -o /tmp/om.png
          cwebp -quiet -q 82 -m 6 -sharp_yuv -resize 420 420 /tmp/om.png -o assets/watermarks/om-watermark-420.webp

          for file in assets/icons/*.png; do
            out="${file%.png}.webp"
            cwebp -quiet -q 90 -m 6 -sharp_yuv "$file" -o "$out"
          done

          ls -lh assets/rudrankaa-logo-440.webp assets/watermarks/*-[45][02]0.webp assets/icons/*.webp

      - name: Apply loading and accessibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          html = replace_once(
              html,
              '    <link rel="stylesheet" href="myth-busters.css?v=3" />\n    <link rel="stylesheet" href="legal.css?v=6" />\n    <link rel="stylesheet" href="service-details.css?v=2" />',
              '    <link rel="stylesheet" href="myth-busters.css?v=3" media="print" onload="this.media=\'all\'" />\n    <noscript><link rel="stylesheet" href="myth-busters.css?v=3" /></noscript>\n    <link rel="stylesheet" href="legal.css?v=6" media="print" onload="this.media=\'all\'" />\n    <noscript><link rel="stylesheet" href="legal.css?v=6" /></noscript>\n    <link rel="stylesheet" href="service-details.css?v=2" media="print" onload="this.media=\'all\'" />\n    <noscript><link rel="stylesheet" href="service-details.css?v=2" /></noscript>',
              'homepage non-critical stylesheet block',
          )

          html = replace_once(
              html,
              '    <script defer src="myth-busters.js?v=6"></script>',
              '    <script defer src="myth-busters-loader.js?v=1"></script>',
              'homepage Myth Busters script reference',
          )

          html = replace_once(
              html,
              '              src="assets/rudrankaa-logo-600.png"\n              alt="Rudrankaa"',
              '              src="assets/rudrankaa-logo-440.webp"\n              alt="Rudrankaa"\n              width="440"\n              height="315"',
              'header logo source',
          )

          html = replace_once(
              html,
              '          src="assets/watermarks/ardhanarishwar-watermark.webp"\n          alt=""\n          width="600"\n          height="600"',
              '          src="assets/watermarks/ardhanarishwar-watermark-520.webp"\n          alt=""\n          width="520"\n          height="520"',
              'About watermark source',
          )

          html = replace_once(
              html,
              '            src="assets/watermarks/om-watermark.webp"\n            alt=""\n            width="600"\n            height="600"',
              '            src="assets/watermarks/om-watermark-420.webp"\n            alt=""\n            width="420"\n            height="420"',
              'contact watermark source',
          )

          html = replace_once(
              html,
              '              src="assets/whatsapp-qr.png"\n              alt="WhatsApp QR code for Rudrankaa"',
              '              src="assets/whatsapp-qr.png"\n              alt="WhatsApp QR code for Rudrankaa"\n              loading="lazy"\n              decoding="async"',
              'WhatsApp QR image',
          )

          footer_brand = '<a class="brand footer-brand footer-directory-brand" href="#top" aria-label="Rudrankaa home">'
          html = replace_once(html, footer_brand, '<a class="brand footer-brand footer-directory-brand" href="#top">', 'homepage footer brand accessible label')
          index.write_text(html, encoding='utf-8')

          archive = Path('myth-busters.html')
          archive_html = archive.read_text(encoding='utf-8')
          archive_html = archive_html.replace(
              '<a class="brand footer-brand footer-directory-brand" href="index.html#top" aria-label="Rudrankaa home">',
              '<a class="brand footer-brand footer-directory-brand" href="index.html#top">',
          )
          archive.write_text(archive_html, encoding='utf-8')

          styles = Path('styles-v2.css')
          css = styles.read_text(encoding='utf-8')
          css = replace_once(css, 'url("assets/icons/manifestation-grid.png")', 'url("assets/icons/manifestation-grid.webp")', 'manifestation icon URL')
          css = replace_once(css, 'url("assets/icons/name-energy.png")', 'url("assets/icons/name-energy.webp")', 'name icon URL')
          css = replace_once(css, 'url("assets/icons/personal-numerology.png")', 'url("assets/icons/personal-numerology.webp")', 'personal icon URL')
          css = replace_once(css, 'url("assets/icons/business-career.png")', 'url("assets/icons/business-career.webp")', 'business icon URL')
          css = replace_once(css, 'url("assets/icons/critical-number.png")', 'url("assets/icons/critical-number.webp")', 'critical icon URL')
          css = replace_once(css, 'url("assets/icons/rudraksha-consultancy.png")', 'url("assets/icons/rudraksha-consultancy.webp")', 'Rudraksha icon URL')
          css = replace_once(css, '  color: rgba(255, 255, 255, 0.42);\n  font-size: 0.72rem;', '  color: rgba(255, 255, 255, 0.52);\n  font-size: 0.72rem;', 'footer-bottom accessible text color')
          styles.write_text(css, encoding='utf-8')

          legal = Path('legal.css')
          css = legal.read_text(encoding='utf-8')
          css = replace_once(css, '.trademark-notice {\n  margin: 0;\n  color: rgba(255, 255, 255, 0.42);', '.trademark-notice {\n  margin: 0;\n  color: rgba(255, 255, 255, 0.52);', 'trademark accessible text color')
          legal.write_text(css, encoding='utf-8')

          birth = Path('birth-number.css')
          css = birth.read_text(encoding='utf-8')
          css = replace_once(css, '.birth-day-input.is-default-example {\n  color: #9a8f88;', '.birth-day-input.is-default-example {\n  color: #756a64;', 'default Birth Number example contrast')
          birth.write_text(css, encoding='utf-8')

          myth_js = Path('myth-busters.js')
          js = myth_js.read_text(encoding='utf-8')
          js = replace_once(
              js,
              '    button.setAttribute("aria-label", `Open ${label}`);',
              '    button.setAttribute("aria-label", `Myth Buster ${formattedDate}. Open flyer`);',
              'Myth Buster card accessible name',
          )
          myth_js.write_text(js, encoding='utf-8')

          Path('myth-busters-loader.js').write_text('''(() => {\n  const gallery = document.querySelector("#myth-busters-grid[data-gallery-view=\\"home\\"]");\n  if (!gallery) return;\n\n  let loaded = false;\n  const loadGallery = () => {\n    if (loaded) return;\n    loaded = true;\n    const script = document.createElement("script");\n    script.src = "myth-busters.js?v=7";\n    script.async = true;\n    document.head.appendChild(script);\n  };\n\n  if (!("IntersectionObserver" in window)) {\n    window.addEventListener("load", loadGallery, { once: true });\n    return;\n  }\n\n  const observer = new IntersectionObserver(\n    (entries) => {\n      if (!entries.some((entry) => entry.isIntersecting)) return;\n      observer.disconnect();\n      loadGallery();\n    },\n    { rootMargin: "700px 0px" },\n  );\n\n  observer.observe(gallery);\n})();\n''', encoding='utf-8')

          # Archive loads the full gallery directly, so only bump its script cache key.
          archive_html = archive.read_text(encoding='utf-8')
          archive_html = replace_once(archive_html, 'myth-busters.js?v=6', 'myth-busters.js?v=7', 'archive Myth Busters script cache key')
          archive.write_text(archive_html, encoding='utf-8')

          validator = Path('scripts/validate-site.mjs')
          js = validator.read_text(encoding='utf-8')
          marker = 'const homepageHtml = await readFile(path.join(repositoryRoot, "index.html"), "utf8");\n'
          checks = '''for (const requiredOptimizedAsset of [\n  "assets/rudrankaa-logo-440.webp",\n  "assets/watermarks/ardhanarishwar-watermark-520.webp",\n  "assets/watermarks/om-watermark-420.webp",\n  "myth-busters-loader.js",\n]) {\n  if (!repositoryFileSet.has(requiredOptimizedAsset)) {\n    errors.push(`Missing optimized display asset: ${requiredOptimizedAsset}`);\n  }\n}\n\n'''
          if checks.strip() in js:
              raise SystemExit('optimized asset checks already present unexpectedly')
          js = replace_once(js, marker, checks + marker, 'validator homepage marker for optimized assets')
          validator.write_text(js, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0)

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Check whitespace
        run: git diff --check

      - name: Commit Lighthouse fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html myth-busters.html styles-v2.css legal.css birth-number.css myth-busters.js myth-busters-loader.js scripts/validate-site.mjs assets/rudrankaa-logo-440.webp assets/watermarks/ardhanarishwar-watermark-520.webp assets/watermarks/om-watermark-420.webp assets/icons/*.webp
          if git diff --cached --quiet; then
            echo "No Lighthouse fixes to commit."
            exit 0
          fi
          git commit -m "Improve mobile performance and accessibility"
          git push origin HEAD:cleanup/v1.5-closure
