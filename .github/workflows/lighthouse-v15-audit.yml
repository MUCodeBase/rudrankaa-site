name: Lighthouse v1.5 audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Lighthouse
        run: npm install --global lighthouse@13

      - name: Run mobile Lighthouse
        run: |
          lighthouse "https://cleanup-v1-5-closure-rudrankaa-preview.reach-mup.workers.dev" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-mobile.json

      - name: Run desktop Lighthouse
        run: |
          lighthouse "https://cleanup-v1-5-closure-rudrankaa-preview.reach-mup.workers.dev" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-desktop.json

      - name: Print audit summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = (name, path) => {
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const score = (key) => Math.round((r.categories[key]?.score ?? 0) * 100);
            const audit = (key) => r.audits[key]?.displayValue ?? r.audits[key]?.numericValue ?? 'n/a';
            console.log(`LIGHTHOUSE ${name}`);
            console.log(`Performance: ${score('performance')}`);
            console.log(`Accessibility: ${score('accessibility')}`);
            console.log(`Best Practices: ${score('best-practices')}`);
            console.log(`SEO: ${score('seo')}`);
            console.log(`FCP: ${audit('first-contentful-paint')}`);
            console.log(`LCP: ${audit('largest-contentful-paint')}`);
            console.log(`TBT: ${audit('total-blocking-time')}`);
            console.log(`CLS: ${audit('cumulative-layout-shift')}`);
            console.log(`Speed Index: ${audit('speed-index')}`);
            console.log('---');
          };
          report('MOBILE', './lighthouse-mobile.json');
          report('DESKTOP', './lighthouse-desktop.json');
          NODE

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-v1.5-reports
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json
          retention-days: 7
