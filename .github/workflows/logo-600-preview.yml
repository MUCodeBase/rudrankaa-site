name: Build 600px logo review

on:
  push:
    branches:
      - preview/logo-600px-review
    paths:
      - ".github/workflows/logo-600-preview.yml"
      - "assets/rudrankaa-logo.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logo-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: preview/logo-600px-review

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create exact 600px display derivative
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/rudrankaa-logo.png")
          target = Path("assets/rudrankaa-logo-600.png")

          with Image.open(source) as image:
              image.load()
              width = 600
              height = round(image.height * width / image.width)
              resized = image.resize((width, height), Image.Resampling.LANCZOS)
              resized.save(target, format="PNG", optimize=True, compress_level=9)
              print(f"Master: {image.width}x{image.height} -> Review: {width}x{height}")
          PY

      - name: Use derivative only on review branch
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("index.html")
          text = page.read_text(encoding="utf-8")
          old = 'src="assets/rudrankaa-logo.png"'
          new = 'src="assets/rudrankaa-logo-600.png"'
          if old not in text and new not in text:
              raise SystemExit("Approved logo source reference was not found.")
          page.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit review asset
        run: |
          if [[ -z "$(git status --porcelain -- assets/rudrankaa-logo-600.png index.html)" ]]; then
            echo "Review asset already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/rudrankaa-logo-600.png index.html
          git commit -m "Generate 600px logo review asset"
          git push origin HEAD:preview/logo-600px-review
