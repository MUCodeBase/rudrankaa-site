name: Optimize static assets

on:
  push:
    paths:
      - "scripts/extract-static-assets.mjs"
      - ".github/workflows/optimize-static-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the updated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract approved assets and remove dead embedded data
        run: node scripts/extract-static-assets.mjs

      - name: Commit optimized static assets when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- index.html styles-v2.css assets/rudrankaa-logo.png)" ]]; then
            echo "Static assets are already optimized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html styles-v2.css assets/rudrankaa-logo.png
          git commit -m "Optimize embedded static assets"
          git push
